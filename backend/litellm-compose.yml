services:
  litellm-db:
    image: postgres:16-alpine
    container_name: mira-litellm-db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: mira-litellm-proxy
    depends_on:
      - litellm-db
    ports:
      - "4000:4000"
    environment:
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-mira-master-change-me}
      LITELLM_DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
      LITELLM_UI_PASSWORD: ${LITELLM_UI_PASSWORD:-admin}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-dummy}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-dummy}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    restart: unless-stopped

volumes:
  litellm_pgdata:
